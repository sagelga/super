name: Bundle Size

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tailwind.config.mjs"
  push:
    # The push run stores the baseline bundle that PRs are compared against.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Next.js 16 (Turbopack) only writes .next/diagnostics/route-bundle-stats.json
          # when this flag is set. The analyzer below reads that file.
          TURBOPACK_STATS: 1

      - name: Analyze bundle size
        uses: michalsanger/nextjs-turbopack-bundle-size@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          stats-path: .next/diagnostics/route-bundle-stats.json
          minimum-change-threshold: 256
          budget-percent-increase-red: 20
