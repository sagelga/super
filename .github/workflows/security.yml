name: Security

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production dependencies)
        # Only runtime dependencies are bundled into the deployed Worker.
        # Build/test tooling lives in devDependencies and would otherwise fail
        # this gate on advisories that never reach production.
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev dependency advisories
        # Visibility only: dev-only findings must not block merges.
        continue-on-error: true
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
